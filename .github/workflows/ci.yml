name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RetailPulse unit tests
        run: python -m unittest discover -s tests -v
      - name: Install NYC Taxi project dependencies
        run: python -m pip install -r projects/nyc-taxi-ai-data-platform/requirements.txt
      - name: Run NYC Taxi project unit tests
        working-directory: projects/nyc-taxi-ai-data-platform
        run: python -m unittest discover -s tests -v
      - name: Validate compose file
        run: docker compose config --quiet
